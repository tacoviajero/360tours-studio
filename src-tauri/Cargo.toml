[package]
name = "tours360-studio"
version = "0.1.0"
description = "360Tours Studio desktop shell"
authors = ["TacoViajero"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "tours360_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
